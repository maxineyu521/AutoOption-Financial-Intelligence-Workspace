services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles:
      - ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    profiles:
      - ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_PULL_MODEL: ${OLLAMA_PULL_MODEL:-llama3:latest}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - ollama pull "$OLLAMA_PULL_MODEL"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: autooptions/app:local
    restart: unless-stopped
    env_file:
      - .env
      - .env.docker
    environment:
      PYTHONPATH: /app
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - hf_cache:/opt/hf-cache
      - xdg_cache:/opt/xdg-cache
    command:
      - streamlit
      - run
      - Frontend/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.fileWatcherType=none

  worker:
    image: autooptions/app:local
    restart: "no"
    profiles:
      - worker
    env_file:
      - .env
      - .env.docker
    environment:
      PYTHONPATH: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - hf_cache:/opt/hf-cache
      - xdg_cache:/opt/xdg-cache
    command:
      - python
      - -c
      - "import time; time.sleep(10**9)"

volumes:
  ollama_storage:
  hf_cache:
  xdg_cache:
