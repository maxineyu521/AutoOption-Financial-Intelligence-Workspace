<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1200" style="background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.05" />
    </filter>
    <filter id="shadow-heavy" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.1" />
    </filter>

    <linearGradient id="bg-data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="bg-ingest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
  </defs>

  <text x="675" y="45" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle">Data Source &amp; Vector Ingestion Workflow</text>
  <text x="675" y="70" font-size="16" font-weight="500" fill="#64748b" text-anchor="middle">Transforming Heterogeneous Market Data into Dual-Vector Indexes &amp; Global Agent Context</text>

  <rect x="30" y="110" width="500" height="1060" rx="16" fill="url(#bg-data)" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)" />
  <text x="280" y="150" font-size="20" font-weight="800" fill="#1e3a8a" text-anchor="middle">I. Data Sources &amp; Medallion Pipeline</text>

  <rect x="50" y="170" width="460" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)" />
  <text x="280" y="195" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">Heterogeneous Data Sources</text>
  <rect x="65" y="205" width="85" height="25" rx="4" fill="#f1f5f9" />
  <text x="107" y="222" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">YFinance (Options)</text>
  <rect x="160" y="205" width="60" height="25" rx="4" fill="#f1f5f9" />
  <text x="190" y="222" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">FRED</text>
  <rect x="230" y="205" width="65" height="25" rx="4" fill="#f1f5f9" />
  <text x="262" y="222" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">GDELT</text>
  <rect x="305" y="205" width="105" height="25" rx="4" fill="#f1f5f9" />
  <text x="357" y="222" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">SEC EDGAR (4/8-K)</text>
  <rect x="420" y="205" width="75" height="25" rx="4" fill="#f1f5f9" />
  <text x="457" y="222" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">GPR Index</text>

  <path d="M 280 240 L 280 260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="50" y="265" width="460" height="150" rx="8" fill="#ffffff" stroke="#cd853f" stroke-width="2" filter="url(#shadow)" />
  <text x="70" y="290" font-size="15" font-weight="800" fill="#cd853f">Bronze Layer: Raw Processing &amp; Lineage</text>
  
  <rect x="65" y="300" width="430" height="105" rx="6" fill="#fffbeb" stroke="#fde68a" />
  <text x="75" y="318" font-size="11" font-weight="700" fill="#b45309">⭐ SEC Form 4 Specific Extraction:</text>
  <text x="75" y="333" font-size="10" fill="#78350f">Extracts XML tags: `role/officerTitle`, `post_transaction_shares`, and `is_10b5_1_planned`.</text>
  <text x="75" y="350" font-size="11" font-weight="700" fill="#b45309">Other Transformations:</text>
  <text x="75" y="365" font-size="10" fill="#78350f">• SEC 8-K: Strip HTML, convert to Markdown, semantic split by 'Item' boundary.</text>
  <text x="75" y="379" font-size="10" fill="#78350f">• News: Raw scraper text + DuckDuckGo URL fallback caching.</text>
  <text x="75" y="393" font-size="10" fill="#78350f">• Options/Macro: Raw API payloads; generates `has_bronze_evidence` downstream flag.</text>

  <path d="M 280 415 L 280 435" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="50" y="440" width="460" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)" />
  <text x="70" y="465" font-size="15" font-weight="800" fill="#475569">Silver Layer: Deterministic Parquet Analytics</text>
  
  <rect x="65" y="475" width="430" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="75" y="492" font-size="11" fill="#475569" font-weight="700">• Options History Data:</text>
  <text x="75" y="506" font-size="10" fill="#64748b">Vectorized enrichment mapping `dte`, `moneyness_pct`, `spread_pct`, and `is_liquid`.</text>
  <text x="75" y="521" font-size="11" fill="#475569" font-weight="700">• Macro &amp; GPR Stats:</text>
  <text x="75" y="535" font-size="10" fill="#64748b">Calculates hard math (MoM %, YoY %, 3M MA, historical percentiles).</text>

  <path d="M 280 550 L 280 570" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="50" y="575" width="460" height="205" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)" />
  <text x="70" y="600" font-size="15" font-weight="800" fill="#d97706">Gold Layer: Semantic Artifacts &amp; Narratives</text>
  
  <rect x="65" y="615" width="430" height="65" rx="6" fill="#fffbeb" stroke="#fde68a" />
  <text x="75" y="632" font-size="11" font-weight="700" fill="#b45309">⭐ News LLM Enrichment (gpt-4o-mini JSONL):</text>
  <text x="75" y="647" font-size="10" fill="#78350f">Generates dense summaries, extracts entities, assesses volatility implications, and</text>
  <text x="75" y="661" font-size="10" fill="#78350f">assigns a quantitative `tone_score` (-5 Bearish to +5 Bullish).</text>

  <rect x="65" y="690" width="430" height="80" rx="6" fill="#fffbeb" stroke="#fde68a" />
  <text x="75" y="707" font-size="11" font-weight="700" fill="#b45309">⭐ Macro &amp; GPR Markdown Narratives:</text>
  <text x="75" y="722" font-size="10" fill="#78350f">Transforms statistics into conditional RAG Markdown narratives.</text>
  <text x="75" y="738" font-size="10" font-weight="600" fill="#b45309">Outputs dual formats:</text>
  <text x="75" y="752" font-size="10" fill="#78350f">1. `qdrant_input.jsonl` (Passed to Vector Ingestion)</text>
  <text x="75" y="766" font-size="10" fill="#78350f">2. Dated Markdown Files (`macro_context_YYYY-MM-DD.md`)</text>

  <path d="M 280 780 L 280 810" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />

  <rect x="50" y="815" width="460" height="110" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow-heavy)" />
  <text x="70" y="840" font-size="15" font-weight="800" fill="#0369a1">Global Agent Context (Static BG)</text>
  
  <rect x="65" y="855" width="430" height="60" rx="6" fill="#f0f9ff" stroke="#7dd3fc" />
  <text x="75" y="872" font-size="11" font-weight="700" fill="#0369a1">File: `Data/Agent_Context/latest_macro_context.md`</text>
  <text x="75" y="888" font-size="10" fill="#0c4a6e">The Macro/GPR pipeline actively overwrites this file daily.</text>
  <text x="75" y="902" font-size="10" font-weight="600" fill="#0c4a6e">It bypasses vector retrieval completely to act as the "Whole BG for Agent Sense",</text>
  <text x="75" y="916" font-size="10" font-weight="600" fill="#0c4a6e">grounding every AI reasoning loop in the current real-world environment.</text>

  <path d="M 280 925 L 280 970" stroke="#d97706" stroke-width="3" stroke-dasharray="4" marker-end="url(#arrow-gold)" />
  <text x="290" y="955" font-size="11" font-weight="700" fill="#d97706">JSONL Only</text>

  <rect x="50" y="975" width="460" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow-heavy)" />
  <text x="280" y="1000" font-size="15" font-weight="800" fill="#92400e" text-anchor="middle">Gold-Layer Semantic JSONL Artifacts</text>
  <text x="280" y="1018" font-size="12" fill="#b45309" text-anchor="middle">(Structured payloads ready for vector embedding)</text>

  <path d="M 510 1005 L 565 1005" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6" fill="none" marker-end="url(#arrow-gold)" />


  <rect x="580" y="110" width="740" height="1060" rx="16" fill="url(#bg-ingest)" stroke="#6ee7b7" stroke-width="2" filter="url(#shadow)" />
  <text x="950" y="150" font-size="20" font-weight="800" fill="#065f46" text-anchor="middle">II. Vector Ingestion Phase (`QdrantHybridIngestor`)</text>

  <rect x="610" y="180" width="680" height="110" rx="8" fill="#ffffff" stroke="#a7f3d0" filter="url(#shadow)" />
  <text x="630" y="205" font-size="15" font-weight="800" fill="#047857">1. Runtime Connection Factory Bootstrap</text>
  <text x="630" y="225" font-size="12" fill="#065f46">Shared singleton initialization via `Scripts/vector_store/connection.py`.</text>
  
  <rect x="630" y="240" width="310" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" />
  <text x="785" y="255" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Qdrant Cloud Connection</text>
  <text x="785" y="270" font-size="10" fill="#15803d" text-anchor="middle">Validates credentials with bounded retry loops</text>

  <rect x="960" y="240" width="310" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" />
  <text x="1115" y="255" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Embedding Model Factory</text>
  <text x="1115" y="270" font-size="10" fill="#15803d" text-anchor="middle">Loads device-aware HuggingFace/Ollama singletons</text>

  <path d="M 950 290 L 950 325" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />

  <rect x="610" y="330" width="680" height="100" rx="8" fill="#ffffff" stroke="#a7f3d0" filter="url(#shadow)" />
  <text x="630" y="355" font-size="15" font-weight="800" fill="#047857">2. Database Bootstrap &amp; Schema Reconciliation</text>
  <text x="630" y="375" font-size="12" fill="#065f46">Prepares the database to handle complex multi-field semantic retrieval queries.</text>
  
  <rect x="630" y="390" width="640" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="645" y="408" font-size="12" font-weight="700" fill="#047857">Action: `init_collection_with_indexes()`</text>
  <text x="880" y="408" font-size="11" fill="#065f46">Creates DB and indexes payload metadata (ticker, source, time) upfront.</text>

  <path d="M 950 430 L 950 465" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />

  <rect x="610" y="470" width="680" height="130" rx="8" fill="#ffffff" stroke="#a7f3d0" filter="url(#shadow)" />
  <text x="630" y="495" font-size="15" font-weight="800" fill="#047857">3. Idempotent Data Loading &amp; Normalization</text>
  <text x="630" y="515" font-size="12" fill="#065f46">Processes incoming JSONL records, ensuring safety against duplicate ingestion runs.</text>
  
  <rect x="630" y="530" width="310" height="55" rx="6" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="645" y="545" font-size="12" font-weight="700" fill="#047857">Payload Normalization</text>
  <text x="645" y="560" font-size="11" fill="#065f46">• Converts metadata tags (e.g. topic list)</text>
  <text x="645" y="575" font-size="11" fill="#065f46">• Asserts `has_bronze_evidence` lineage flag</text>

  <rect x="960" y="530" width="310" height="55" rx="6" fill="#fffbeb" stroke="#fde68a" />
  <text x="975" y="545" font-size="12" font-weight="700" fill="#b45309">⭐ Strategy: Deterministic ID</text>
  <text x="975" y="560" font-size="11" fill="#78350f">SEC seed: uuid5(SYSTEM_NAMESPACE, accession_no)</text>
  <text x="975" y="575" font-size="11" fill="#78350f">News/GPR: native data.id; uuid4 only if missing</text>

  <path d="M 950 600 L 950 635" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />

  <rect x="610" y="640" width="680" height="130" rx="8" fill="#ffffff" stroke="#a7f3d0" filter="url(#shadow)" />
  <text x="630" y="665" font-size="15" font-weight="800" fill="#047857">4. Dual Embedding Generation</text>
  <text x="630" y="685" font-size="12" fill="#065f46">Simultaneously computes two mathematical representations for every chunk.</text>

  <rect x="630" y="700" width="310" height="55" rx="6" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="645" y="715" font-size="12" font-weight="700" fill="#047857">Dense Semantic Vector</text>
  <text x="645" y="730" font-size="11" fill="#065f46">Model: `BAAI/bge-base-en-v1.5`</text>
  <text x="645" y="745" font-size="11" fill="#065f46">Captures broad conceptual proximity</text>

  <rect x="960" y="700" width="310" height="55" rx="6" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="975" y="715" font-size="12" font-weight="700" fill="#047857">Sparse Lexical Vector</text>
  <text x="975" y="730" font-size="11" fill="#065f46">Model: `prithivida/Splade_PP_en_v1`</text>
  <text x="975" y="745" font-size="11" fill="#065f46">Tracks exact terms, acronyms, and tickers</text>

  <path d="M 785 770 L 950 805" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 1115 770 L 950 805" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />

  <rect x="610" y="810" width="680" height="150" rx="8" fill="#ffffff" stroke="#a7f3d0" filter="url(#shadow)" />
  <text x="630" y="835" font-size="15" font-weight="800" fill="#047857">5. Assembly, Upsert, and Telemetry</text>
  
  <rect x="630" y="855" width="640" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="645" y="873" font-size="12" font-weight="700" fill="#047857">1. Unify PointStruct:</text>
  <text x="780" y="873" font-size="11" fill="#065f46">Combines UUID, Metadata Payload, Dense Vector, and Sparse Vector.</text>

  <rect x="630" y="905" width="310" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="645" y="923" font-size="12" font-weight="700" fill="#047857">2. Execute Batch Upsert</text>
  <text x="790" y="923" font-size="11" fill="#065f46">Writes to `financial_rag_gold`</text>

  <rect x="960" y="905" width="310" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="975" y="923" font-size="12" font-weight="700" fill="#047857">⭐ 3. Audit Observability</text>
  <text x="1120" y="923" font-size="11" fill="#065f46">Logs to `ingestion.log`</text>

  <path d="M 950 960 L 950 985" stroke="#047857" stroke-width="3" marker-end="url(#arrow-green)" />

  <rect x="730" y="990" width="440" height="50" rx="8" fill="#10b981" stroke="#047857" stroke-width="2" filter="url(#shadow-heavy)" />
  <text x="950" y="1013" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Live Qdrant Vector Index (Gold Layer)</text>
  <text x="950" y="1030" font-size="11" font-weight="600" fill="#ecfdf5" text-anchor="middle">Fully synced, linearly scalable, and ready for retrieval phase</text>

</svg>
